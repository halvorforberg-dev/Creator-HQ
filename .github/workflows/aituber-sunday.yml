name: Little Wild publication status inspection
on:
  push:
    paths:
      - '.github/workflows/aituber-sunday.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect video publication status and API response schema (read-only)
        env:
          AITUBER_API_KEY: ${{ secrets.AITUBER_API_KEY }}
        run: |
          node <<'NODE'
          (async()=>{
          const base='https://app.aituber.app/api/v1';
          const vId='0a955403-a28a-49d8-8066-b309ecb39907';
          const h={Authorization:'Bearer '+process.env.AITUBER_API_KEY,Accept:'application/json'};
          for(const path of ['/videos/'+vId,'/videos']){
            const r=await fetch(base+path,{headers:h});if(!r.ok){console.log(path+' HTTP '+r.status);continue}
            const x=await r.json(),v=path==='/videos'?((x.videos||x.items||x.data||[]).find(v=>v.id===vId)||{}):(x.video||x.data||x);
            console.log('VIDEO_DETAIL '+path,JSON.stringify(v).slice(0,13000));
          }
          const r=await fetch(base+'/openapi.json');
          const j=await r.json();
          const op=j.paths?.['/publications']?.post;
          const res=op?.responses;
          console.log('PUBLICATION_RESPONSE_SCHEMAS',JSON.stringify(res).slice(0,16000));
          })().catch(e=>{console.error('INSPECT_ERROR',e.message);process.exitCode=1})
          NODE
