name: Little Wild Sunday video (thumbnail recovery)
on:
  push:
    paths:
      - '.github/workflows/aituber-sunday.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: littlewild-sunday-one-off
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate recovery source
        run: node --check scripts/littlewild-sunday-recover.cjs
      - name: Publish same video once thumbnail is ready (no new generation)
        env:
          AITUBER_API_KEY: ${{ secrets.AITUBER_API_KEY }}
        run: node scripts/littlewild-sunday-recover.cjs
