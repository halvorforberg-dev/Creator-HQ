name: Little Wild Sunday video (one-off)
on:
  push:
    paths:
      - '.github/workflows/aituber-sunday.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: littlewild-sunday-one-off
  cancel-in-progress: false
jobs:
  sunday:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Sunday production source
        run: node --check scripts/littlewild-sunday.cjs
      - name: Create full-motion Little Wild video and publish to verified YouTube
        env:
          AITUBER_API_KEY: ${{ secrets.AITUBER_API_KEY }}
        run: node scripts/littlewild-sunday.cjs
