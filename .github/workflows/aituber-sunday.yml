name: Validate AI Tuber finished dog and wild movies
on:
  push:
    paths:
      - '.github/workflows/aituber-sunday.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read finished video scene and export metadata
        env:
          AITUBER_API_KEY: ${{ secrets.AITUBER_API_KEY }}
        run: |
          node <<'NODE'
          (async()=>{
            for(const [label,id] of [['wild','0a955403-a28a-49d8-8066-b309ecb39907'],['dogs','9202429c-c831-4ca0-9f74-2b40e16930b7']]){
              const r=await fetch('https://app.aituber.app/api/v1/videos/'+id,{headers:{Authorization:'Bearer '+process.env.AITUBER_API_KEY}});
              if(!r.ok){console.log(label+' HTTP '+r.status);continue}
              const data=await r.json(),v=data.video??data.data??data;
              const scenes=(v.images??v.scenes??[]);
              console.log(label.toUpperCase()+'_METADATA',JSON.stringify({
                id,title:v.title,status:v.status,templateId:v.templateId,mediaType:v.mediaType,duration:v.durationSeconds??v.duration,exportStatus:v.exportStatus,thumbnail:v.thumbnail,
                keys:Object.keys(v).filter(k=>/publi|export|youtube|channel|status|duration|template|mediaType/i.test(k)),
                scenes:scenes.map(s=>({text:s.text,hasVideo:!!s.videoUrl,sceneDuration:s.clipDurationSeconds})).slice(0,18)
              }).slice(0,14000));
            }
          })().catch(e=>{console.error('VIDEO_INSPECTION_ERROR',e.message);process.exitCode=1});
          NODE
