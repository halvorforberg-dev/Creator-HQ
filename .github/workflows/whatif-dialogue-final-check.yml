name: What If 42-second dogs final preflight
on:
  push:
    paths: ['.github/workflows/whatif-dialogue-final-check.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm speech, native sound tracks and moving clips without new generation
        env:
          AITUBER_API_KEY: ${{ secrets.AITUBER_API_KEY }}
        run: |
          node <<'NODE'
          (async()=>{
            const id='359192ea-04ef-4eb9-ad92-53be956fac3e';
            const response=await fetch('https://app.aituber.app/api/v1/videos/'+id,{headers:{Authorization:'Bearer '+process.env.AITUBER_API_KEY,Accept:'application/json'},signal:AbortSignal.timeout(25000)});
            if(!response.ok)throw Error('GET video HTTP '+response.status);
            const j=await response.json(),v=j.video??j.data??j;
            const s=(v.images??[]).filter(x=>x.videoUrl),duration=s.reduce((a,x)=>a+Number(x.clipDurationSeconds||0),0);
            console.log('FINAL_VIDEO',JSON.stringify({id,sceneCount:s.length,duration,thumbnailStatus:v.thumbnail?.status,templateId:v.templateId,hasSeparateNarration:!!v.audioUrl,scriptText:v.script?.slice(0,1300),scenes:s.map((x,i)=>({i,text:x.text,duration:x.clipDurationSeconds,prompt:x.instruction?.slice(0,500)}))}).slice(0,18500));
            for(let i=0;i<Math.min(3,s.length);i++){
              const res=await fetch(s[i].videoUrl,{signal:AbortSignal.timeout(30000)});
              if(!res.ok){console.log('SCENE_FETCH_FAILED',i,res.status);continue}
              const bytes=Buffer.from(await res.arrayBuffer());
              console.log('SCENE_MEDIA',JSON.stringify({index:i,bytes:bytes.length,hasAudioTrack:bytes.includes(Buffer.from('soun')),hasVideoTrack:bytes.includes(Buffer.from('vide'))}));
            }
            console.log('PASS_DURATION',duration>=35&&duration<=50,'PASS_SCENES',s.length>=4);
          })().catch(e=>{console.error('FINAL_INSPECTION_ERROR',e.message);process.exitCode=1});
          NODE
