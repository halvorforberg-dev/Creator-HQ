name: Creator HQ Telegram
on:
  schedule:
    # Poll roughly every ten minutes. GitHub may delay scheduled runs.
    - cron: '4,14,24,34,44,54 * * * *'
    # Daily and weekly summaries use UTC; Oslo clock time changes with DST.
    - cron: '33 7 * * *'
    - cron: '43 17 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'poll, daily or weekly'
        required: true
        default: poll
        type: choice
        options: [check, poll, daily, weekly]
permissions:
  contents: read
concurrency:
  group: creator-hq-telegram
  cancel-in-progress: false
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check secret configuration
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN missing. Add it under Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::TELEGRAM_BOT_TOKEN missing from GitHub Actions Secrets"
            exit 1
          fi
          echo "✅ Bot token secret is configured (contents hidden)." >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$BOT_CHAT" ]; then
            echo "ℹ️ TELEGRAM_CHAT_ID not set; first-time pairing mode. Send /start and run mode poll." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Private Telegram chat ID configured (contents hidden)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_MODE: ${{ inputs.mode }}
          RUN_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/telegram_hq_bot.py
