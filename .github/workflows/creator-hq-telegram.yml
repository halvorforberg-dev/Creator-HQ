name: Creator HQ Telegram - disabled by user
# 2026-11-18: User no longer wants Telegram messages.
# Preserve bot implementation and unit tests for history, but no scheduled
# polling, daily/weekly reports or any Telegram network sending.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate bot code without sending messages
        run: |
          python3 -m compileall -q scripts/telegram_hq_bot.py
          python3 -m unittest discover -s tests -p 'test_telegram_hq.py'
      - name: Telegram messages are disabled
        run: echo 'Telegram schedules and message sends are disabled by user request on 2026-11-18.'
