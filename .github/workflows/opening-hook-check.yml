name: Verify opening hooks for new YouTube scripts
on:
  push:
    paths:
      - 'scripts/opening-hook-guard.cjs'
      - 'scripts/aituber-whatif.cjs'
      - 'data/whatif-production-queue.json'
      - '.github/workflows/opening-hook-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check code syntax
        run: |
          node --check scripts/opening-hook-guard.cjs
          node --check scripts/aituber-whatif.cjs
      - name: Verify What If opening title and first spoken words
        run: |
          node scripts/opening-hook-guard.cjs
          node <<'NODE'
          const fs=require('fs');
          const {validateOpeningHook}=require('./scripts/opening-hook-guard.cjs');
          const queue=JSON.parse(fs.readFileSync('./data/whatif-production-queue.json','utf8'));
          for(const item of queue){
            const result=validateOpeningHook({channel:'whatif',script:item.script,openingTitle:item.openingTitle,openingTitleSeconds:item.openingTitleSeconds});
            console.log('PASSED',item.id,JSON.stringify(result));
          }
          console.log('Checked',queue.length,'new What If script drafts');
          NODE
