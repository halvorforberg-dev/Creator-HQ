name: Refresh channel visuals
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-channel-branding.py'
      - '.github/workflows/channel-branding.yml'
  schedule:
    - cron: '40 6 * * 1'
permissions:
  contents: write
jobs:
  update-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public YouTube channel images
        run: python scripts/fetch-channel-branding.py
      - name: Commit fetched artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Update Creator HQ channel artwork"
            git push
          fi
